<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baby Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #06091a;
    --surface: #0c1228;
    --card: #111827;
    --card2: #161f35;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8edf5;
    --text2: #8b9ab5;
    --text3: #4f617a;
    --accent: #a78bfa;
    --accent2: #7c3aed;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --blue: #38bdf8;
    --pink: #f472b6;
    --purple: #c084fc;
    --input: #0c1228;
    --overlay: rgba(0,0,0,0.75);
  }
  [data-theme="light"] {
    --bg: #f0f4ff;
    --surface: #e8edf8;
    --card: #ffffff;
    --card2: #f5f7ff;
    --border: rgba(0,0,0,0.07);
    --border2: rgba(0,0,0,0.13);
    --text: #1a2035;
    --text2: #5a6a85;
    --text3: #9baabf;
    --input: #f0f4ff;
    --overlay: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  #app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
    background: var(--bg);
  }

  /* ── HEADER ── */
  header {
    padding: 18px 20px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    position: relative;
    z-index: 50;
  }
  .header-left h1 { font-size: 20px; font-weight: 900; background: linear-gradient(130deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-left p { font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 600; }
  .header-right { display: flex; gap: 8px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border2); background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; color: var(--text2); }

  /* ── SCROLL AREA ── */
  #scroll-area { flex: 1; overflow-y: auto; padding: 20px 16px 24px; scrollbar-width: none; }
  #scroll-area::-webkit-scrollbar { display: none; }

  /* ── BOTTOM NAV ── */
  nav { display: flex; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 0 max(12px, env(safe-area-inset-bottom)); flex-shrink: 0; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px 0; }
  .nav-icon { font-size: 21px; }
  .nav-label { font-size: 10px; font-weight: 700; color: var(--text3); font-family: 'Nunito', sans-serif; }
  .nav-btn.active .nav-label { color: var(--accent); }
  .nav-dot { width: 18px; height: 3px; border-radius: 2px; background: var(--accent); margin-top: 1px; }

  /* ── CARDS ── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 22px; margin-bottom: 14px; }
  .card-label { font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }

  /* ── HERO TIMER ── */
  #timer-card { text-align: center; position: relative; overflow: hidden; }
  #timer-value { font-size: 62px; font-weight: 900; line-height: 1; letter-spacing: -2px; margin-bottom: 10px; }
  #timer-alert { font-size: 13px; font-weight: 700; margin-top: 10px; min-height: 20px; }
  #timer-last { font-size: 12px; color: var(--text3); margin-top: 10px; }
  .prog-track { height: 6px; background: var(--border2); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 3px; transition: width 0.8s; }

  /* ── STAT GRID ── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
  .stat-num { font-size: 44px; font-weight: 900; line-height: 1; margin: 4px 0; }
  .stat-sub { font-size: 11px; color: var(--text3); font-weight: 600; }
  .stat-note { font-size: 11px; font-weight: 700; margin-top: 8px; }

  /* ── ACTION BUTTONS ── */
  .action-btn { width: 100%; padding: 20px; border-radius: 18px; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; text-align: left; font-family: 'Nunito', sans-serif; }
  .action-btn .btn-emoji { font-size: 28px; flex-shrink: 0; }
  .action-btn .btn-text-main { display: block; font-size: 16px; font-weight: 800;}
  .action-btn .btn-text-sub { display: block; font-size: 12px; font-weight: 600; opacity: 0.8; }
  .btn-feed { background: linear-gradient(135deg, #34d399, #059669); }
  .btn-sleep { background: linear-gradient(135deg, #c084fc, #7e22ce); }
  .btn-diaper { background: linear-gradient(135deg, #38bdf8, #0ea5e9); }
  .btn-weight { background: linear-gradient(135deg, #f472b6, #db2777); }

  /* ── LOG ITEMS ── */
  .log-item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px 18px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .log-icon { font-size: 22px; }
  .log-body { flex: 1; }
  .log-title { font-size: 14px; font-weight: 800; }
  .log-meta { font-size: 11px; color: var(--text3); margin-top: 3px; font-weight: 600; }
  .del-btn { background: rgba(248,113,113,0.12); border: none; border-radius: 10px; color: var(--red); width: 34px; height: 34px; cursor: pointer; font-size: 15px; }

  /* ── ANALYTICS ── */
  .analytics-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 14px; }
  .analytics-title { font-size: 15px; font-weight: 800; margin-bottom: 16px; }
  .chart-wrap { width: 100%; height: 220px; }
  .mini-stat-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .mini-stat { flex: 1; background: var(--card2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; }
  .mini-stat-num { font-size: 28px; font-weight: 900; line-height: 1; }
  .mini-stat-label { font-size: 11px; color: var(--text3); font-weight: 700; margin-top: 4px; }
  .alert-box { border-radius: 14px; padding: 14px; font-size: 13px; font-weight: 700; display: flex; gap: 10px; margin-top:10px; }

  /* ── MODALS ── */
  .modal-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet { background: var(--card); border-radius: 28px 28px 0 0; padding: 12px 22px max(28px, env(safe-area-inset-bottom)); width: 100%; max-width: 480px; transform: translateY(100%); transition: transform 0.3s; }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 22px; }
  .modal-center { align-items: center; padding: 20px; }
  .modal-center .modal-sheet { border-radius: 24px; padding: 28px; transform: scale(0.95); }
  .modal-overlay.open.modal-center .modal-sheet { transform: scale(1); }

  /* ── TABS & INPUTS ── */
  .type-tabs { display: flex; gap: 4px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 4px;}
  .type-tab { flex: 1; min-width: 70px; padding: 10px 4px; border-radius: 14px; border: 1px solid var(--border); background: var(--card2); color: var(--text3); font-size: 12px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; text-align: center; }
  .type-tab.active { background: linear-gradient(135deg, var(--accent), #60a5fa); color: #fff; border-color: transparent; }
  
  .choice-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .choice-btn { flex: 1; min-width: calc(33% - 8px); padding: 12px 4px; border-radius: 14px; border: 2px solid var(--border2); background: var(--input); color: var(--text2); font-size: 13px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; text-align: center; }
  .choice-btn .choice-emoji { display: block; font-size: 20px; margin-bottom: 4px; }
  
  .field-label { font-size: 13px; font-weight: 800; color: var(--text2); margin-bottom: 8px; display: block; }
  .field-input { width: 100%; padding: 15px 16px; border-radius: 14px; border: 1.5px solid var(--border2); background: var(--input); color: var(--text); font-size: 16px; font-family: 'Nunito', sans-serif; font-weight: 700; margin-bottom: 20px; outline: none; }
  .submit-row { display: flex; gap: 10px; }
  .cancel-btn { padding: 16px 20px; border-radius: 16px; border: 1.5px solid var(--border2); background: transparent; color: var(--text2); font-size: 16px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; }
  .submit-btn { flex: 1; padding: 16px; border-radius: 16px; border: none; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; }

  .seg-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .seg-tab { flex: 1; padding: 11px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--text2); font-size: 13px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; }
  .seg-tab.active { background: linear-gradient(135deg, var(--accent), #60a5fa); color: #fff; }

  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-left">
      <h1 id="header-name">🌙 Baby's Tracker</h1>
      <p id="header-age"></p>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="openProfile()">⚙️</button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
    </div>
  </header>

  <div id="scroll-area">
    <!-- DASHBOARD VIEW -->
    <div id="view-dashboard">
      <div id="timer-card" class="card">
        <p class="card-label">Since Last Feed</p>
        <div id="timer-value">—</div>
        <div id="timer-alert"></div>
        <div class="prog-track" id="timer-prog-track" style="display:none">
          <div class="prog-fill" id="timer-prog-fill"></div>
        </div>
        <div id="timer-last"></div>
      </div>

      <div class="stat-grid">
        <div class="stat-card" id="wet-card">
          <div class="card-label">Wet Diapers</div>
          <div class="stat-num" id="wet-count" style="color:var(--blue)">0</div>
          <div class="stat-sub">last 24 hours</div>
          <div class="stat-note" id="wet-note"></div>
        </div>
        <div class="stat-card">
          <div class="card-label">Sleep Today</div>
          <div class="stat-num" id="sleep-total" style="color:var(--purple)">0h</div>
          <div class="stat-sub">last 24 hours</div>
          <div class="stat-note" id="sleep-note"></div>
        </div>
      </div>

      <div style="font-size: 14px; font-weight: 800; color: var(--text2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px;">Quick Log</div>
      
      <button class="action-btn btn-feed" onclick="openLog('feed')">
        <span class="btn-emoji">🍼</span>
        <div><span class="btn-text-main">Log Feed</span><span class="btn-text-sub">Breastmilk, formula or solids</span></div>
      </button>
      <button class="action-btn btn-sleep" onclick="openLog('sleep')">
        <span class="btn-emoji">💤</span>
        <div><span class="btn-text-main">Log Sleep</span><span class="btn-text-sub">Naps and overnight rest</span></div>
      </button>
      <button class="action-btn btn-diaper" onclick="openLog('diaper')">
        <span class="btn-emoji">💧</span>
        <div><span class="btn-text-main">Log Diaper</span><span class="btn-text-sub">Wet, dirty or both</span></div>
      </button>
      <button class="action-btn btn-weight" onclick="openLog('weight')">
        <span class="btn-emoji">⚖️</span>
        <div><span class="btn-text-main">Log Weight</span><span class="btn-text-sub">Track growth curve</span></div>
      </button>
    </div>

    <!-- HISTORY VIEW -->
    <div id="view-history" style="display:none">
      <div class="seg-tabs">
        <button class="seg-tab active" id="seg-feed" onclick="switchSeg('feed')">🍼 Feed</button>
        <button class="seg-tab" id="seg-sleep" onclick="switchSeg('sleep')">💤 Sleep</button>
        <button class="seg-tab" id="seg-diaper" onclick="switchSeg('diaper')">💧 Diaper</button>
      </div>
      <div id="history-list"></div>
    </div>

    <!-- ANALYTICS VIEW -->
    <div id="view-analytics" style="display:none">
      
      <div class="analytics-card">
        <div class="analytics-title">📊 24-Hour Timeline</div>
        <div class="chart-wrap">
          <canvas id="timeline-chart"></canvas>
        </div>
      </div>

      <div class="analytics-card">
        <div class="analytics-title">🍼 Feed Summary (24h)</div>
        <div id="feed-summary"></div>
      </div>

      <div class="analytics-card">
        <div class="analytics-title">⚖️ Weight Progress</div>
        <div class="chart-wrap"><canvas id="weight-chart"></canvas></div>
      </div>

    </div>
  </div>

  <!-- NAV -->
  <nav>
    <button class="nav-btn active" id="nav-dashboard" onclick="switchView('dashboard')"><span class="nav-icon">🏠</span><span class="nav-label">Home</span><div class="nav-dot" id="dot-dashboard"></div></button>
    <button class="nav-btn" id="nav-history" onclick="switchView('history')"><span class="nav-icon">📋</span><span class="nav-label">History</span><div class="nav-dot" id="dot-history" style="visibility:hidden"></div></button>
    <button class="nav-btn" id="nav-analytics" onclick="switchView('analytics')"><span class="nav-icon">📊</span><span class="nav-label">Analytics</span><div class="nav-dot" id="dot-analytics" style="visibility:hidden"></div></button>
  </nav>
</div>

<!-- LOG MODAL -->
<div class="modal-overlay" id="log-modal" onclick="handleOverlayClick(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>

    <div class="type-tabs">
      <button class="type-tab active" id="tab-feed" onclick="switchLogTab('feed')">🍼 Feed</button>
      <button class="type-tab" id="tab-sleep" onclick="switchLogTab('sleep')">💤 Sleep</button>
      <button class="type-tab" id="tab-diaper" onclick="switchLogTab('diaper')">💧 Diaper</button>
      <button class="type-tab" id="tab-weight" onclick="switchLogTab('weight')">⚖️ Weight</button>
    </div>

    <!-- FEED FORM -->
    <div id="form-feed">
      <label class="field-label">Feed type</label>
      <div class="choice-row" id="feed-type-row">
        <button class="choice-btn active" data-val="Breastmilk" onclick="pickFeedType(this)"><span class="choice-emoji">🤱</span>Breastmilk</button>
        <button class="choice-btn" data-val="Formula" onclick="pickFeedType(this)"><span class="choice-emoji">🍼</span>Formula</button>
        <button class="choice-btn" data-val="Pumped" onclick="pickFeedType(this)"><span class="choice-emoji">🥛</span>Pumped</button>
      </div>
      
      <!-- Side selector (Only for Breastmilk) -->
      <div id="breast-side-row" style="display:block;">
        <label class="field-label">Side</label>
        <div class="choice-row" id="side-choice-row">
          <button class="choice-btn active" data-val="Left" onclick="pickSide(this)">Left</button>
          <button class="choice-btn" data-val="Right" onclick="pickSide(this)">Right</button>
          <button class="choice-btn" data-val="Both" onclick="pickSide(this)">Both</button>
        </div>
      </div>

      <label class="field-label">Duration (minutes)</label>
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="feed-timer-btn" type="button" class="choice-btn" onclick="toggleFeedTimer()" style="flex: 1; background: rgba(52,211,153,0.1); color: var(--green); border-color: var(--green);">⏱ Start Timer</button>
        <input class="field-input" id="feed-duration" type="number" min="1" placeholder="e.g. 15" style="margin-bottom: 0; flex: 1;">
      </div>
      <div class="submit-row">
        <button class="cancel-btn" onclick="closeLog()">✕</button>
        <button class="submit-btn" style="background:var(--green)" onclick="submitFeed()">Log Feed ✓</button>
      </div>
    </div>

    <!-- SLEEP FORM -->
    <div id="form-sleep" style="display:none">
      <label class="field-label">Sleep Duration (minutes)</label>
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="sleep-timer-btn" type="button" class="choice-btn" onclick="toggleSleepTimer()" style="flex: 1; background: rgba(192,132,252,0.1); color: var(--purple); border-color: var(--purple);">⏱ Start Sleep</button>
        <input class="field-input" id="sleep-duration" type="number" min="1" placeholder="e.g. 45" style="margin-bottom: 0; flex: 1;">
      </div>
      <label class="field-label">Notes</label>
      <input class="field-input" id="sleep-notes" type="text" placeholder="Nap, night sleep, etc.">
      <div class="submit-row">
        <button class="cancel-btn" onclick="closeLog()">✕</button>
        <button class="submit-btn" style="background:var(--purple)" onclick="submitSleep()">Log Sleep ✓</button>
      </div>
    </div>

    <!-- DIAPER FORM -->
    <div id="form-diaper" style="display:none">
      <label class="field-label">Condition</label>
      <div class="choice-row" id="diaper-type-row">
        <button class="choice-btn active" data-val="Wet" onclick="pickDiaperType(this)"><span class="choice-emoji">💧</span>Wet</button>
        <button class="choice-btn" data-val="Dirty" onclick="pickDiaperType(this)"><span class="choice-emoji">💩</span>Dirty</button>
        <button class="choice-btn" data-val="Both" onclick="pickDiaperType(this)"><span class="choice-emoji">💧💩</span>Both</button>
      </div>
      <div class="submit-row">
        <button class="cancel-btn" onclick="closeLog()">✕</button>
        <button class="submit-btn" style="background:var(--blue)" onclick="submitDiaper()">Log Diaper ✓</button>
      </div>
    </div>

    <!-- WEIGHT FORM -->
    <div id="form-weight" style="display:none">
      <label class="field-label">Weight (kg)</label>
      <input class="field-input" id="weight-value" type="number" step="0.01" placeholder="e.g. 3.45">
      <label class="field-label">Date</label>
      <input class="field-input" id="weight-date" type="date">
      <div class="submit-row">
        <button class="cancel-btn" onclick="closeLog()">✕</button>
        <button class="submit-btn" style="background:var(--pink)" onclick="submitWeight()">Log Weight ✓</button>
      </div>
    </div>

  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal-overlay modal-center" id="profile-modal" onclick="handleProfileOverlayClick(event)">
  <div class="modal-sheet">
    <div style="font-size: 20px; font-weight: 900; margin-bottom: 20px;">👶 Baby Profile</div>
    <label class="field-label">Name</label>
    <input class="field-input" id="profile-name" type="text" placeholder="Baby's name">
    <label class="field-label">Birth Date</label>
    <input class="field-input" id="profile-birth" type="date">
    <div class="submit-row">
      <button class="cancel-btn" onclick="closeProfile()">Cancel</button>
      <button class="submit-btn" style="background:var(--accent)" onclick="saveProfile()">Save ✓</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════ STATE ═══ */
const STORE = 'baby-tracker-v3';
let data = {
  profile: { name: '', birthDate: '' },
  feeds: [],
  diapers: [],
  weights: [],
  sleeps: [],
  theme: 'dark'
};

let activeFeedStart = localStorage.getItem('activeFeedStart') || null;
let feedTimerInterval = null;

let activeSleepStart = localStorage.getItem('activeSleepStart') || null;
let sleepTimerInterval = null;

let timelineChart = null;
let weightChart = null;

function load() { try { const raw = localStorage.getItem(STORE); if (raw) data = Object.assign(data, JSON.parse(raw)); } catch(e) {} }
function save() { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e) {} }

/* ═══════════════════════════════════════ UTILS ═══ */
function now() { return Date.now(); }
function minsSince(ts) { return Math.floor((now() - new Date(ts).getTime()) / 60000); }
function fmtDuration(mins) {
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m > 0 ? h + 'h ' + m + 'm' : h + 'h';
}
function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function fmtDate(ts) {
  const d = new Date(ts), today = new Date(), yesterday = new Date(today - 86400000);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

/* ═══════════════════════════════════════ TIMERS ═══ */
function toggleFeedTimer() {
  const btn = document.getElementById('feed-timer-btn');
  const input = document.getElementById('feed-duration');
  if (!activeFeedStart) {
    activeFeedStart = now();
    localStorage.setItem('activeFeedStart', activeFeedStart);
    btn.innerHTML = '⏹ Stop (0m)';
    btn.style.color = 'var(--red)'; btn.style.borderColor = 'var(--red)';
    feedTimerInterval = setInterval(() => {
      const m = Math.floor((now() - parseInt(activeFeedStart)) / 60000);
      btn.innerHTML = `⏹ Stop (${m}m)`;
    }, 60000);
  } else {
    input.value = Math.max(1, Math.floor((now() - parseInt(activeFeedStart)) / 60000));
    activeFeedStart = null; localStorage.removeItem('activeFeedStart'); clearInterval(feedTimerInterval);
    btn.innerHTML = '⏱ Start Timer'; btn.style.color = 'var(--green)'; btn.style.borderColor = 'var(--green)';
  }
}

function toggleSleepTimer() {
  const btn = document.getElementById('sleep-timer-btn');
  const input = document.getElementById('sleep-duration');
  if (!activeSleepStart) {
    activeSleepStart = now();
    localStorage.setItem('activeSleepStart', activeSleepStart);
    btn.innerHTML = '⏹ Wake Up (0m)';
    btn.style.color = 'var(--red)'; btn.style.borderColor = 'var(--red)';
    sleepTimerInterval = setInterval(() => {
      const m = Math.floor((now() - parseInt(activeSleepStart)) / 60000);
      btn.innerHTML = `⏹ Wake Up (${fmtDuration(m)})`;
    }, 60000);
  } else {
    input.value = Math.max(1, Math.floor((now() - parseInt(activeSleepStart)) / 60000));
    activeSleepStart = null; localStorage.removeItem('activeSleepStart'); clearInterval(sleepTimerInterval);
    btn.innerHTML = '⏱ Start Sleep'; btn.style.color = 'var(--purple)'; btn.style.borderColor = 'var(--purple)';
  }
}

/* ═══════════════════════════════════════ DASHBOARD ═══ */
function updateDashboard() {
  // Feed Timer Card
  const lastF = data.feeds[0];
  const tv = document.getElementById('timer-value');
  const tp = document.getElementById('timer-prog-track');
  const pf = document.getElementById('timer-prog-fill');
  const tl = document.getElementById('timer-last');
  
  if (!lastF) { tv.textContent = 'No feed'; } 
  else {
    const m = minsSince(lastF.timestamp);
    tv.textContent = fmtDuration(m);
    tv.style.color = m > 150 ? 'var(--red)' : m > 120 ? 'var(--amber)' : 'var(--green)';
    tp.style.display = 'block';
    pf.style.width = Math.min(100, (m / 180) * 100) + '%';
    pf.style.background = tv.style.color;
    
    let sideStr = lastF.side ? ` (${lastF.side})` : '';
    tl.textContent = `Last: ${lastF.type}${sideStr} at ${fmtTime(lastF.timestamp)}`;
  }

  // Stat Grid
  const h24 = now() - 86400000;
  const wet = data.diapers.filter(d => new Date(d.timestamp).getTime() > h24 && d.condition !== 'Dirty').length;
  document.getElementById('wet-count').textContent = wet;
  
  const sleepMins = data.sleeps.filter(s => new Date(s.timestamp).getTime() > h24).reduce((acc, s) => acc + (s.duration || 0), 0);
  document.getElementById('sleep-total').textContent = Math.round(sleepMins/60) + 'h';
}

/* ═══════════════════════════════════════ VIEWS & TABS ═══ */
let currentView = 'dashboard';
function switchView(v) {
  ['dashboard','history','analytics'].forEach(id => {
    document.getElementById('view-'+id).style.display = (id===v)?'block':'none';
    document.getElementById('nav-'+id).classList.toggle('active', id===v);
    document.getElementById('dot-'+id).style.visibility = (id===v)?'visible':'hidden';
  });
  currentView = v;
  if(v==='history') renderHistory();
  if(v==='analytics') renderAnalytics();
}

let currentSeg = 'feed';
function switchSeg(seg) {
  currentSeg = seg;
  ['feed','sleep','diaper'].forEach(s => document.getElementById('seg-'+s).classList.toggle('active', s===seg));
  renderHistory();
}

/* ═══════════════════════════════════════ LOGGING MODAL ═══ */
let feedType = 'Breastmilk', breastSide = 'Left', diaperType = 'Wet';

function openLog(tab) {
  switchLogTab(tab);
  document.getElementById('log-modal').classList.add('open');
  if(tab==='weight') document.getElementById('weight-date').value = new Date().toISOString().split('T')[0];
}
function closeLog() { document.getElementById('log-modal').classList.remove('open'); }
function handleOverlayClick(e) { if(e.target.id === 'log-modal') closeLog(); }

function switchLogTab(tab) {
  ['feed','sleep','diaper','weight'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('form-'+t).style.display = (t===tab)?'block':'none';
  });
}

function pickFeedType(btn) {
  feedType = btn.dataset.val;
  document.querySelectorAll('#feed-type-row .choice-btn').forEach(b => {
    const act = b===btn;
    b.style.borderColor = act?'var(--green)':'var(--border2)';
    b.style.color = act?'var(--green)':'var(--text2)';
  });
  // Show side only if Breastmilk
  document.getElementById('breast-side-row').style.display = (feedType === 'Breastmilk') ? 'block' : 'none';
}

function pickSide(btn) {
  breastSide = btn.dataset.val;
  document.querySelectorAll('#side-choice-row .choice-btn').forEach(b => {
    const act = b===btn;
    b.style.borderColor = act?'var(--green)':'var(--border2)';
    b.style.color = act?'var(--green)':'var(--text2)';
  });
}

function pickDiaperType(btn) {
  diaperType = btn.dataset.val;
  document.querySelectorAll('#diaper-type-row .choice-btn').forEach(b => {
    const act = b===btn;
    b.style.borderColor = act?'var(--blue)':'var(--border2)';
    b.style.color = act?'var(--blue)':'var(--text2)';
  });
}

/* ═══════════════════════════════════════ SUBMIT ═══ */
function submitFeed() {
  const dur = parseInt(document.getElementById('feed-duration').value);
  if(activeFeedStart) { activeFeedStart=null; localStorage.removeItem('activeFeedStart'); clearInterval(feedTimerInterval); }
  data.feeds.unshift({ id: now(), timestamp: new Date().toISOString(), type: feedType, side: (feedType==='Breastmilk'?breastSide:null), duration: dur||null });
  save(); document.getElementById('feed-duration').value=''; closeLog(); updateDashboard(); if(currentView==='history') renderHistory();
}

function submitSleep() {
  const dur = parseInt(document.getElementById('sleep-duration').value);
  const notes = document.getElementById('sleep-notes').value;
  if(activeSleepStart) { activeSleepStart=null; localStorage.removeItem('activeSleepStart'); clearInterval(sleepTimerInterval); }
  data.sleeps.unshift({ id: now(), timestamp: new Date().toISOString(), duration: dur||0, notes: notes||null });
  save(); document.getElementById('sleep-duration').value=''; document.getElementById('sleep-notes').value=''; closeLog(); updateDashboard(); if(currentView==='history') renderHistory();
}

function submitDiaper() {
  data.diapers.unshift({ id: now(), timestamp: new Date().toISOString(), condition: diaperType });
  save(); closeLog(); updateDashboard(); if(currentView==='history') renderHistory();
}

function submitWeight() {
  const w = parseFloat(document.getElementById('weight-value').value);
  const d = document.getElementById('weight-date').value;
  if(!w) return;
  data.weights.push({ id: now(), date: d, weight: w });
  data.weights.sort((a,b)=>new Date(a.date)-new Date(b.date));
  save(); closeLog();
}

/* ═══════════════════════════════════════ HISTORY ═══ */
function renderHistory() {
  const list = document.getElementById('history-list');
  const arr = data[currentSeg + 's'] || [];
  
  if(!arr.length) { list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)">No entries yet.</div>`; return; }

  list.innerHTML = arr.map((item, i) => {
    let icon, title, meta;
    if(currentSeg === 'feed') {
      icon = '🍼'; 
      title = item.type + (item.side ? ` (${item.side})` : '') + (item.duration ? ` · ${item.duration}m` : '');
      meta = `${fmtDate(item.timestamp)} · ${fmtTime(item.timestamp)}`;
    } else if(currentSeg === 'sleep') {
      icon = '💤';
      title = `Sleep · ${fmtDuration(item.duration)}`;
      meta = `${fmtDate(item.timestamp)} · ${fmtTime(item.timestamp)} ${item.notes ? '· '+item.notes : ''}`;
    } else if(currentSeg === 'diaper') {
      icon = item.condition==='Dirty'?'💩':item.condition==='Both'?'💧💩':'💧';
      title = item.condition + ' Diaper';
      meta = `${fmtDate(item.timestamp)} · ${fmtTime(item.timestamp)}`;
    }
    
    return `<div class="log-item">
      <span class="log-icon">${icon}</span>
      <div class="log-body">
        <div class="log-title">${title}</div>
        <div class="log-meta">${meta}</div>
      </div>
      <button class="del-btn" onclick="deleteEntry('${currentSeg}', ${i})">🗑</button>
    </div>`;
  }).join('');
}

function deleteEntry(type, idx) {
  if(!confirm('Delete entry?')) return;
  data[type+'s'].splice(idx, 1); save(); updateDashboard(); renderHistory();
}

/* ═══════════════════════════════════════ ANALYTICS (CHART.JS) ═══ */
function renderAnalytics() {
  renderTimelineChart();
  renderWeightChart();
}

function renderTimelineChart() {
  const ctx = document.getElementById('timeline-chart').getContext('2d');
  if(timelineChart) timelineChart.destroy();

  const h24 = now() - 86400000;
  const filterRecent = (arr) => arr.filter(x => new Date(x.timestamp).getTime() > h24);
  
  // Convert timestamp to a decimal hour (0-24) relative to 24h ago
  const toDecimalHour = (ts) => (new Date(ts).getTime() - h24) / 3600000;

  const sleepData = filterRecent(data.sleeps).map(s => ({ x: toDecimalHour(s.timestamp), y: 3 }));
  const diaperData = filterRecent(data.diapers).map(d => ({ x: toDecimalHour(d.timestamp), y: 2 }));
  const feedData = filterRecent(data.feeds).map(f => ({ x: toDecimalHour(f.timestamp), y: 1 }));

  const isDark = document.documentElement.dataset.theme === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
  const textColor = isDark ? '#8b9ab5' : '#5a6a85';

  timelineChart = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [
        { label: 'Sleep', data: sleepData, backgroundColor: '#c084fc', pointRadius: 6 },
        { label: 'Diaper', data: diaperData, backgroundColor: '#38bdf8', pointRadius: 6 },
        { label: 'Feed', data: feedData, backgroundColor: '#34d399', pointRadius: 6 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { 
          min: 0, max: 24, grid: { color: gridColor },
          ticks: { color: textColor, callback: (val) => val % 24 + 'h' } 
        },
        y: {
          min: 0.5, max: 3.5, grid: { color: gridColor },
          ticks: { color: textColor, callback: (val) => {
            if(val===1) return 'Feed'; if(val===2) return 'Diaper'; if(val===3) return 'Sleep'; return '';
          }}
        }
      }
    }
  });

  // Simple Summary below chart
  const recentFeeds = filterRecent(data.feeds);
  const totalMins = recentFeeds.reduce((acc, f) => acc + (f.duration||0), 0);
  document.getElementById('feed-summary').innerHTML = `
    <div class="mini-stat-row">
      <div class="mini-stat"><div class="mini-stat-num" style="color:var(--green)">${recentFeeds.length}</div><div class="mini-stat-label">Feeds</div></div>
      <div class="mini-stat"><div class="mini-stat-num" style="color:var(--green)">${totalMins}m</div><div class="mini-stat-label">Total Time</div></div>
    </div>
  `;
}

function renderWeightChart() {
  const ctx = document.getElementById('weight-chart').getContext('2d');
  if(weightChart) weightChart.destroy();
  if(data.weights.length < 2) return;

  const labels = data.weights.map(w => w.date.substring(5)); // Show MM-DD
  const vals = data.weights.map(w => w.weight);

  weightChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ data: vals, borderColor: '#f472b6', tension: 0.4, pointBackgroundColor: '#db2777' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

/* ═══════════════════════════════════════ SETTINGS ═══ */
function openProfile() { document.getElementById('profile-modal').classList.add('open'); }
function closeProfile() { document.getElementById('profile-modal').classList.remove('open'); }
function handleProfileOverlayClick(e) { if(e.target.id === 'profile-modal') closeProfile(); }
function saveProfile() {
  data.profile.name = document.getElementById('profile-name').value;
  data.profile.birthDate = document.getElementById('profile-birth').value;
  save(); closeProfile(); document.getElementById('header-name').textContent = data.profile.name ? `🌙 ${data.profile.name}'s Tracker` : "🌙 Baby's Tracker";
}
function toggleTheme() {
  data.theme = data.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = data.theme;
  save(); if(currentView === 'analytics') renderAnalytics();
}

/* ═══════════════════════════════════════ INIT ═══ */
function init() {
  load();
  document.documentElement.dataset.theme = data.theme;
  document.getElementById('header-name').textContent = data.profile.name ? `🌙 ${data.profile.name}'s Tracker` : "🌙 Baby's Tracker";
  updateDashboard();
  
  // Resume timers
  if(activeFeedStart) {
    const btn = document.getElementById('feed-timer-btn');
    btn.style.color = 'var(--red)'; btn.style.borderColor = 'var(--red)';
    feedTimerInterval = setInterval(() => { btn.innerHTML = `⏹ Stop (${Math.floor((now()-parseInt(activeFeedStart))/60000)}m)`; }, 60000);
  }
  if(activeSleepStart) {
    const btn = document.getElementById('sleep-timer-btn');
    btn.style.color = 'var(--red)'; btn.style.borderColor = 'var(--red)';
    sleepTimerInterval = setInterval(() => { btn.innerHTML = `⏹ Wake Up (${fmtDuration(Math.floor((now()-parseInt(activeSleepStart))/60000))})`; }, 60000);
  }
  setInterval(updateDashboard, 60000);
}
init();
</script>
