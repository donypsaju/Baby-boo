<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baby Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #06091a;
    --surface: #0c1228;
    --card: #111827;
    --card2: #161f35;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8edf5;
    --text2: #8b9ab5;
    --text3: #4f617a;
    --accent: #a78bfa;
    --accent2: #7c3aed;
    --green: #34d399;
    --green2: #059669;
    --amber: #fbbf24;
    --red: #f87171;
    --blue: #38bdf8;
    --blue2: #0ea5e9;
    --pink: #f472b6;
    --pink2: #db2777;
    --input: #0c1228;
    --overlay: rgba(0,0,0,0.75);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #f0f4ff;
    --surface: #e8edf8;
    --card: #ffffff;
    --card2: #f5f7ff;
    --border: rgba(0,0,0,0.07);
    --border2: rgba(0,0,0,0.13);
    --text: #1a2035;
    --text2: #5a6a85;
    --text3: #9baabf;
    --input: #f0f4ff;
    --overlay: rgba(0,0,0,0.55);
    --shadow: 0 8px 32px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  #app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
    background: var(--bg);
  }

  /* ── HEADER ── */
  header {
    padding: 18px 20px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    position: relative;
    z-index: 50;
  }
  .header-left h1 {
    font-size: 20px;
    font-weight: 900;
    background: linear-gradient(130deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-left p {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
    font-weight: 600;
  }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border2);
    background: var(--card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    color: var(--text2);
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.92); background: var(--card2); }

  /* ── SCROLL AREA ── */
  #scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 16px 24px;
    scrollbar-width: none;
  }
  #scroll-area::-webkit-scrollbar { display: none; }

  /* ── BOTTOM NAV ── */
  nav {
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 0 max(12px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 0;
    transition: transform 0.1s;
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-icon { font-size: 21px; }
  .nav-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text3);
    font-family: 'Nunito', sans-serif;
    letter-spacing: 0.3px;
    transition: color 0.15s;
  }
  .nav-btn.active .nav-label { color: var(--accent); }
  .nav-dot { width: 18px; height: 3px; border-radius: 2px; background: var(--accent); margin-top: 1px; }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 14px;
  }
  .card-sm { padding: 18px 20px; }
  .card-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }

  /* ── HERO TIMER ── */
  #timer-card {
    border-radius: 24px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 14px;
    transition: border-color 0.6s, background 0.6s;
    position: relative;
    overflow: hidden;
  }
  #timer-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(ellipse at 50% -20%, var(--glow-color, rgba(52,211,153,0.15)) 0%, transparent 65%);
    pointer-events: none;
    transition: --glow-color 0.6s;
  }
  #timer-value {
    font-size: 62px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 10px;
    transition: color 0.6s;
  }
  #timer-next {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.25);
    border-radius: 100px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    transition: color 0.6s;
  }
  [data-theme="light"] #timer-next { background: rgba(255,255,255,0.5); }
  #timer-alert {
    font-size: 13px;
    font-weight: 700;
    margin-top: 10px;
    min-height: 20px;
  }
  #timer-last {
    font-size: 12px;
    color: var(--text3);
    margin-top: 10px;
  }

  /* ── PROGRESS BAR ── */
  .prog-track {
    height: 6px;
    background: var(--border2);
    border-radius: 3px;
    margin-top: 14px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(.4,0,.2,1), background 0.6s;
  }

  /* ── STAT GRID ── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
  }
  .stat-num {
    font-size: 44px;
    font-weight: 900;
    line-height: 1;
    margin: 4px 0;
  }
  .stat-sub { font-size: 11px; color: var(--text3); font-weight: 600; }
  .stat-note { font-size: 11px; font-weight: 700; margin-top: 8px; }

  /* ── ACTION BUTTONS ── */
  .action-btn {
    width: 100%;
    padding: 20px 20px;
    border-radius: 18px;
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
    transition: transform 0.1s, box-shadow 0.1s;
    font-family: 'Nunito', sans-serif;
    text-align: left;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn .btn-emoji { font-size: 28px; flex-shrink: 0; }
  .action-btn .btn-text { flex: 1; }
  .action-btn .btn-text-main { display: block; }
  .action-btn .btn-text-sub { display: block; font-size: 12px; font-weight: 600; opacity: 0.8; margin-top: 1px; }
  .action-btn .btn-plus { font-size: 22px; flex-shrink: 0; opacity: 0.8; }
  .btn-feed { background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 6px 24px rgba(52,211,153,0.28); }
  .btn-diaper { background: linear-gradient(135deg, #38bdf8, #0ea5e9); box-shadow: 0 6px 24px rgba(56,189,248,0.28); }
  .btn-weight { background: linear-gradient(135deg, #f472b6, #db2777); box-shadow: 0 6px 24px rgba(244,114,182,0.28); }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .section-title { font-size: 14px; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: 1.5px; }
  .section-action {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    padding: 4px 0;
  }

  /* ── LOG ITEMS ── */
  .log-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px 18px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .log-icon { font-size: 22px; flex-shrink: 0; }
  .log-body { flex: 1; min-width: 0; }
  .log-title { font-size: 14px; font-weight: 800; }
  .log-meta { font-size: 11px; color: var(--text3); margin-top: 3px; font-weight: 600; }
  .log-badge {
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 100px;
    flex-shrink: 0;
  }
  .del-btn {
    background: rgba(248,113,113,0.12);
    border: none;
    border-radius: 10px;
    color: var(--red);
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .del-btn:active { background: rgba(248,113,113,0.25); }

  /* ── ANALYTICS ── */
  .analytics-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .analytics-title {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chart-wrap { width: 100%; height: 200px; }
  .mini-stat-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .mini-stat {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .mini-stat-num { font-size: 28px; font-weight: 900; line-height: 1; }
  .mini-stat-label { font-size: 11px; color: var(--text3); font-weight: 700; margin-top: 4px; }
  .alert-box {
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .alert-icon { font-size: 18px; flex-shrink: 0; }
  .alert-warn { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--red); }
  .alert-ok { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--green); }
  .alert-info { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.2); color: var(--accent); }
  .feed-type-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(167,139,250,0.12);
    border: 1px solid rgba(167,139,250,0.2);
    color: var(--accent);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    margin: 3px 4px 3px 0;
  }
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text3);
  }
  .empty-state .empty-emoji { font-size: 44px; margin-bottom: 12px; }
  .empty-state p { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: var(--text2); }
  .empty-state span { font-size: 13px; }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet {
    background: var(--card);
    border-radius: 28px 28px 0 0;
    padding: 12px 22px max(28px, env(safe-area-inset-bottom));
    width: 100%;
    max-width: 480px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 0 auto 22px;
  }
  .modal-title { font-size: 20px; font-weight: 900; margin-bottom: 20px; }

  /* full-screen modal (profile) */
  .modal-center {
    align-items: center;
    padding: 20px;
  }
  .modal-center .modal-sheet {
    border-radius: 24px;
    padding: 28px;
  }

  /* ── TYPE TABS ── */
  .type-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .type-tab {
    flex: 1;
    padding: 12px 6px;
    border-radius: 14px;
    border: none;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all 0.2s;
    background: var(--card2);
    color: var(--text3);
    border: 1px solid var(--border);
  }
  .type-tab.active {
    background: linear-gradient(135deg, var(--accent), #60a5fa);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(124,58,237,0.25);
  }

  /* ── CHOICE PILLS ── */
  .choice-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .choice-btn {
    flex: 1;
    min-width: calc(50% - 4px);
    padding: 14px 10px;
    border-radius: 14px;
    border: 2px solid var(--border2);
    background: var(--input);
    color: var(--text2);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    text-align: center;
    transition: all 0.15s;
  }
  .choice-btn .choice-emoji { display: block; font-size: 22px; margin-bottom: 4px; }
  .choice-btn:active { transform: scale(0.95); }

  /* ── FORM FIELDS ── */
  .field-label { font-size: 13px; font-weight: 800; color: var(--text2); margin-bottom: 8px; display: block; }
  .field-input {
    width: 100%;
    padding: 15px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--border2);
    background: var(--input);
    color: var(--text);
    font-size: 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .field-input:focus { border-color: var(--accent); }
  .field-input::placeholder { color: var(--text3); font-weight: 600; }

  /* Date input fix */
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
  [data-theme="light"] input[type="date"]::-webkit-calendar-picker-indicator { filter: none; }

  /* ── SUBMIT BUTTONS ── */
  .submit-row { display: flex; gap: 10px; }
  .cancel-btn {
    padding: 16px 20px;
    border-radius: 16px;
    border: 1.5px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: background 0.15s;
  }
  .cancel-btn:active { background: var(--card2); }
  .submit-btn {
    flex: 1;
    padding: 16px;
    border-radius: 16px;
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: transform 0.1s, opacity 0.1s;
  }
  .submit-btn:active { transform: scale(0.97); opacity: 0.9; }
  .submit-feed { background: linear-gradient(135deg, #34d399, #059669); }
  .submit-diaper { background: linear-gradient(135deg, #38bdf8, #0ea5e9); }
  .submit-weight { background: linear-gradient(135deg, #f472b6, #db2777); }
  .submit-profile { background: linear-gradient(135deg, var(--accent), #60a5fa); }

  /* ── HISTORY SEGMENT ── */
  .seg-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .seg-tab {
    flex: 1;
    padding: 11px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all 0.15s;
  }
  .seg-tab.active {
    background: linear-gradient(135deg, var(--accent), #60a5fa);
    color: #fff;
    border-color: transparent;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
  .view { animation: fadeUp 0.2s ease both; }
  @keyframes pulse-glow { 0%,100%{opacity:0.6} 50%{opacity:1} }

  /* ── SCROLLBAR NONE ── */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <h1 id="header-name">🌙 Baby's Tracker</h1>
      <p id="header-age"></p>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="openProfile()" title="Settings">⚙️</button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀️</button>
    </div>
  </header>

  <!-- SCROLL AREA -->
  <div id="scroll-area">
    <!-- DASHBOARD VIEW -->
    <div id="view-dashboard" class="view">

      <!-- Hero Timer Card -->
      <div id="timer-card" class="card">
        <p class="card-label" style="text-align:center">Since Last Feed</p>
        <div id="timer-value">—</div>
        <div id="timer-next" style="display:none">
          <span>⏰</span><span id="timer-next-text"></span>
        </div>
        <div id="timer-alert"></div>
        <div class="prog-track" id="timer-prog-track" style="display:none">
          <div class="prog-fill" id="timer-prog-fill"></div>
        </div>
        <div id="timer-last"></div>
      </div>

      <!-- Stat Grid -->
      <div class="stat-grid">
        <div class="stat-card" id="wet-card">
          <div class="card-label">Wet Diapers</div>
          <div class="stat-num" id="wet-count" style="color:var(--blue)">0</div>
          <div class="stat-sub">last 24 hours</div>
          <div class="stat-note" id="wet-note"></div>
        </div>
        <div class="stat-card">
          <div class="card-label">Feeds Today</div>
          <div class="stat-num" id="feed-count" style="color:var(--accent)">0</div>
          <div class="stat-sub">last 24 hours</div>
          <div class="stat-note" id="weight-latest" style="color:var(--pink)"></div>
        </div>
      </div>

      <!-- Quick Log -->
      <div class="section-header">
        <span class="section-title">Quick Log</span>
      </div>
      <button class="action-btn btn-feed" onclick="openLog('feed')">
        <span class="btn-emoji">🍼</span>
        <span class="btn-text">
          <span class="btn-text-main">Log Feed</span>
          <span class="btn-text-sub">Breastmilk, formula or pumped</span>
        </span>
        <span class="btn-plus">+</span>
      </button>
      <button class="action-btn btn-diaper" onclick="openLog('diaper')">
        <span class="btn-emoji">💧</span>
        <span class="btn-text">
          <span class="btn-text-main">Log Diaper</span>
          <span class="btn-text-sub">Wet, dirty or both</span>
        </span>
        <span class="btn-plus">+</span>
      </button>
      <button class="action-btn btn-weight" onclick="openLog('weight')">
        <span class="btn-emoji">⚖️</span>
        <span class="btn-text">
          <span class="btn-text-main">Log Weight</span>
          <span class="btn-text-sub">Track growth over time</span>
        </span>
        <span class="btn-plus">+</span>
      </button>
    </div>

    <!-- HISTORY VIEW -->
    <div id="view-history" class="view" style="display:none">
      <div class="seg-tabs">
        <button class="seg-tab active" id="seg-feed" onclick="switchSeg('feed')">🍼 Feeds</button>
        <button class="seg-tab" id="seg-diaper" onclick="switchSeg('diaper')">💧 Diapers</button>
        <button class="seg-tab" id="seg-weight" onclick="switchSeg('weight')">⚖️ Weights</button>
      </div>
      <div id="history-list"></div>
    </div>

    <!-- ANALYTICS VIEW -->
    <div id="view-analytics" class="view" style="display:none">

      <!-- Weight Chart -->
      <div class="analytics-card">
        <div class="analytics-title">⚖️ Weight Progress
          <button class="section-action" onclick="openLog('weight')">+ Add</button>
        </div>
        <div id="chart-empty" class="empty-state" style="padding:30px 20px">

<!-- ═══════════════════════════════════════════════ PROFILE MODAL ═══ -->
<div class="modal-overlay modal-center" id="profile-modal" onclick="handleProfileOverlayClick(event)">

    <input class="field-input" id="profile-birth" type="date">
    <label class="field-label">Birth Weight (kg) <span style="font-weight:600;color:var(--text3)">optional</span></label>

    <div class="submit-row">
      <button class="cancel-btn" onclick="closeProfile()">Cancel</button>
      <button class="submit-btn submit-profile" onclick="saveProfile()">Save Profile ✓</button>
    </div>

<script>
/* ═══════════════════════════════════════ STATE & STORAGE ═══ */
const STORE = 'baby-tracker-v2';
let data = {
  profile: { name: '', birthDate: '', birthWeight: null },
  feeds: [],
  diapers: [],
  weights: [],
  theme: 'dark'
};

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) data = JSON.parse(raw);
  } catch(e) {}
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e) {}
}

/* ═══════════════════════════════════════ TIME UTILS ═══ */
function now() { return Date.now(); }

function minsSince(ts) {
  return Math.floor((now() - new Date(ts).getTime()) / 60000);
}

function fmtDuration(mins) {
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m > 0 ? h + 'h ' + m + 'm' : h + 'h';
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function fmtDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today - 86400000);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function fmtDateShort(ts) {
  return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function ageStr(birthDate) {
  if (!birthDate) return '';
  const b = new Date(birthDate);
  const n = new Date();
  const days = Math.floor((n - b) / 86400000);
  if (days < 0) return '';
  if (days < 7) return days + (days === 1 ? ' day old' : ' days old');
  const weeks = Math.floor(days / 7);
  if (weeks < 8) return weeks + (weeks === 1 ? ' week old' : ' weeks old');
  const months = Math.floor(days / 30.44);
  return months + (months === 1 ? ' month old' : ' months old');
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ═══════════════════════════════════════ TIMER ═══ */
function updateTimer() {
  const last = data.feeds[0] || null;
  const tv = document.getElementById('timer-value');
  const tn = document.getElementById('timer-next');
  const ta = document.getElementById('timer-alert');
  const tl = document.getElementById('timer-last');
  const tp = document.getElementById('timer-prog-track');
  const pf = document.getElementById('timer-prog-fill');
  const card = document.getElementById('timer-card');

  if (!last) {
    tv.textContent = 'No feed yet';
    tv.style.color = 'var(--text3)';
    tv.style.fontSize = '36px';
    tn.style.display = 'none';
    ta.textContent = '';
    tl.textContent = '';
    tp.style.display = 'none';
    card.style.background = 'var(--card)';
    card.style.borderColor = 'var(--border)';
    return;
  }

  const mins = minsSince(last.timestamp);
  tv.textContent = fmtDuration(mins);
  tv.style.fontSize = mins >= 600 ? '42px' : '62px';

  const MAX = 180;
  const pct = Math.min(100, (mins / MAX) * 100);
  const minsLeft = Math.max(0, MAX - mins);

  let color, bgColor, borderColor, glowColor, alertHtml = '';

  if (mins < 120) {
    color = 'var(--green)';
    bgColor = 'rgba(52,211,153,0.07)';
    borderColor = 'rgba(52,211,153,0.25)';
    glowColor = 'rgba(52,211,153,0.18)';
    pf.style.background = 'var(--green)';
  } else if (mins < 150) {
    color = 'var(--amber)';
    bgColor = 'rgba(251,191,36,0.07)';
    borderColor = 'rgba(251,191,36,0.25)';
    glowColor = 'rgba(251,191,36,0.18)';
    pf.style.background = 'var(--amber)';
    alertHtml = '<span style="color:var(--amber)">🔔 Consider feeding soon</span>';
  } else {
    color = 'var(--red)';
    bgColor = 'rgba(248,113,113,0.07)';
    borderColor = 'rgba(248,113,113,0.3)';
    glowColor = 'rgba(248,113,113,0.18)';
    pf.style.background = 'var(--red)';
    alertHtml = '<span style="color:var(--red)">⚠️ ' + (mins >= MAX ? 'Feeding overdue — time to feed!' : 'Feeding due very soon') + '</span>';
  }

  tv.style.color = color;
  card.style.background = bgColor;
  card.style.borderColor = borderColor;
  card.style.setProperty('--glow-color', glowColor);
  ta.innerHTML = alertHtml;

  tn.style.display = 'inline-flex';
  tn.style.color = color;
  document.getElementById('timer-next-text').textContent = minsLeft > 0
    ? 'Next feed in ' + fmtDuration(minsLeft)
    : 'Feed now';

  tp.style.display = 'block';
  pf.style.width = pct + '%';

  tl.textContent = 'Last: ' + last.type + ' at ' + fmtTime(last.timestamp) +
    (last.duration ? ' · ' + last.duration + ' min' : '');
}

/* ═══════════════════════════════════════ DASHBOARD ═══ */
function updateDashboard() {
  updateTimer();
  const h24 = now() - 86400000;

  const wet = data.diapers.filter(d =>
    new Date(d.timestamp).getTime() > h24 && (d.condition === 'Wet' || d.condition === 'Both')
  ).length;

  const wetCount = document.getElementById('wet-count');
  wetCount.textContent = wet;
  wetCount.style.color = wet < 6 && data.diapers.length ? 'var(--red)' : 'var(--blue)';

  const wetNote = document.getElementById('wet-note');
  if (wet < 6 && data.diapers.length) {
    wetNote.innerHTML = '<span style="color:var(--red)">⚠️ Target: 6+ per day</span>';
    document.getElementById('wet-card').style.borderColor = 'rgba(248,113,113,0.3)';
  } else if (wet >= 6) {
    wetNote.innerHTML = '<span style="color:var(--green)">✓ Great hydration</span>';
    document.getElementById('wet-card').style.borderColor = 'rgba(52,211,153,0.25)';
  } else {
    wetNote.textContent = '';
    document.getElementById('wet-card').style.borderColor = 'var(--border)';
  }

  const feedsToday = data.feeds.filter(f => new Date(f.timestamp).getTime() > h24).length;
  document.getElementById('feed-count').textContent = feedsToday;

  const wl = data.weights.length;
  const wNote = document.getElementById('weight-latest');
  wNote.textContent = wl > 0 ? '⚖️ ' + data.weights[wl-1].weight.toFixed(2) + ' kg' : '';
}

/* ═══════════════════════════════════════ HEADER ═══ */
function updateHeader() {
  const name = data.profile.name || 'Baby';
  document.getElementById('header-name').textContent = '🌙 ' + name + "'s Tracker";
  const age = ageStr(data.profile.birthDate);
  document.getElementById('header-age').textContent = age;
}

/* ═══════════════════════════════════════ VIEWS ═══ */
let currentView = 'dashboard';
let currentSeg = 'feed';
let weightChart = null;

function switchView(v) {
  ['dashboard','history','analytics'].forEach(id => {
    const el = document.getElementById('view-'+id);
    const btn = document.getElementById('nav-'+id);
    const dot = document.getElementById('dot-'+id);
    if (id === v) {
      el.style.display = 'block';
      btn.classList.add('active');
      dot.style.visibility = 'visible';
    } else {
      el.style.display = 'none';
      btn.classList.remove('active');
      dot.style.visibility = 'hidden';
    }
  });
  currentView = v;
  document.getElementById('scroll-area').scrollTop = 0;

  if (v === 'history') renderHistory();
  if (v === 'analytics') renderAnalytics();
}

/* ═══════════════════════════════════════ HISTORY ═══ */
function switchSeg(seg) {
  currentSeg = seg;
  ['feed','diaper','weight'].forEach(s => {
    document.getElementById('seg-'+s).classList.toggle('active', s === seg);
  });
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');

  if (currentSeg === 'feed') {
    if (!data.feeds.length) {
      list.innerHTML = emptyState('🍼', 'No feeds logged yet', 'Tap "Log Feed" on the home screen to get started.');
      return;
    }
    list.innerHTML = data.feeds.map((f, i) => `
      <div class="log-item">
        <span class="log-icon">🍼</span>
        <div class="log-body">
          <div class="log-title">${f.type}${f.duration ? ' &middot; ' + f.duration + ' min' : ''}</div>
          <div class="log-meta">${fmtDate(f.timestamp)} at ${fmtTime(f.timestamp)} &middot; ${fmtDuration(minsSince(f.timestamp))} ago${f.notes ? ' &middot; ' + f.notes : ''}</div>
        </div>
        <button class="del-btn" onclick="deleteFeed(${i})">🗑</button>
      </div>`).join('');
  }

  if (currentSeg === 'diaper') {
    if (!data.diapers.length) {
      list.innerHTML = emptyState('💧', 'No diapers logged yet', 'Start tracking to monitor hydration.');
      return;
    }
    list.innerHTML = data.diapers.map((d, i) => {
      const emoji = d.condition === 'Wet' ? '💧' : d.condition === 'Dirty' ? '💩' : d.condition === 'Both' ? '💧💩' : '⭕';
      return `<div class="log-item">
        <span class="log-icon">${emoji}</span>
        <div class="log-body">
          <div class="log-title">${d.condition}</div>
          <div class="log-meta">${fmtDate(d.timestamp)} at ${fmtTime(d.timestamp)} &middot; ${fmtDuration(minsSince(d.timestamp))} ago${d.notes ? ' &middot; ' + d.notes : ''}</div>
        </div>
        <button class="del-btn" onclick="deleteDiaper(${i})">🗑</button>
      </div>`;
    }).join('');
  }

  if (currentSeg === 'weight') {
    if (!data.weights.length) {
      list.innerHTML = emptyState('⚖️', 'No weights logged yet', 'Track weight to monitor growth.');
      return;
    }
    const sorted = [...data.weights].reverse();
    list.innerHTML = sorted.map((w, i) => {
      const realIdx = data.weights.length - 1 - i;
      const prev = realIdx > 0 ? data.weights[realIdx - 1] : null;
      const diff = prev ? (w.weight - prev.weight) : null;
      const diffStr = diff !== null
        ? (diff >= 0 ? '<span style="color:var(--green)">▲ +' : '<span style="color:var(--red)">▼ ') + Math.abs(diff).toFixed(2) + ' kg</span>'
        : '';
      return `<div class="log-item">
        <span class="log-icon">⚖️</span>
        <div class="log-body">
          <div class="log-title">${w.weight.toFixed(2)} kg ${diffStr}</div>
          <div class="log-meta">${fmtDate(w.date)} · ${w.date}</div>
        </div>
        <button class="del-btn" onclick="deleteWeight(${realIdx})">🗑</button>
      </div>`;
    }).join('');
  }
}

function emptyState(emoji, title, sub) {
  return `<div class="empty-state"><div class="empty-emoji">${emoji}</div><p>${title}</p><span>${sub}</span></div>`;
}

/* ═══════════════════════════════════════ ANALYTICS ═══ */
function renderAnalytics() {
  renderWeightChart();
  renderFeedSummary();
  renderDiaperSummary();
}

function renderWeightChart() {
  const wrap = document.getElementById('chart-wrap');
  const empty = document.getElementById('chart-empty');

  if (data.weights.length < 2) {
    wrap.style.display = 'none';
    empty.style.display = 'block';
    if (weightChart) { weightChart.destroy(); weightChart = null; }
    return;
  }

  wrap.style.display = 'block';
  empty.style.display = 'none';

  const sorted = [...data.weights].sort((a, b) => new Date(a.date) - new Date(b.date));
  const labels = sorted.map(w => w.date);
  const values = sorted.map(w => w.weight);

  const isDark = document.documentElement.dataset.theme === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
  const tickColor = isDark ? '#4f617a' : '#9baabf';
  const tooltipBg = isDark ? '#111827' : '#ffffff';
  const tooltipText = isDark ? '#e8edf5' : '#1a2035';

  if (weightChart) weightChart.destroy();

  const ctx = document.getElementById('weight-chart').getContext('2d');

  // WHO approximate reference line (simplified: newborn 3.3kg, +0.2kg/week for first 3 months)
  // Just a gentle reference - we'll show it if birthWeight + birthDate exist
  const datasets = [{
    label: 'Weight (kg)',
    data: values,
    borderColor: '#f472b6',
    backgroundColor: 'rgba(244,114,182,0.12)',
    borderWidth: 3,
    pointBackgroundColor: '#db2777',
    pointBorderColor: '#fff',
    pointBorderWidth: 2,
    pointRadius: 6,
    pointHoverRadius: 8,
    fill: true,
    tension: 0.4
  }];

  weightChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 600, easing: 'easeOutQuart' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: tooltipBg,
          titleColor: tooltipText,
          bodyColor: tooltipText,
          borderColor: 'rgba(244,114,182,0.3)',
          borderWidth: 1,
          padding: 12,
          cornerRadius: 12,
          callbacks: {
            label: ctx => ' ' + ctx.parsed.y.toFixed(2) + ' kg'
          }
        }
      },
      scales: {
        x: {
          grid: { color: gridColor },
          ticks: { color: tickColor, font: { size: 10, family: 'Nunito', weight: '700' }, maxTicksLimit: 6 },
          border: { display: false }
        },
        y: {
          grid: { color: gridColor },
          ticks: { color: tickColor, font: { size: 10, family: 'Nunito', weight: '700' }, callback: v => v.toFixed(1) + 'kg' },
          border: { display: false }
        }
      }
    }
  });
}

function renderFeedSummary() {
  const el = document.getElementById('feed-summary');
  const h24 = now() - 86400000;
  const recent = data.feeds.filter(f => new Date(f.timestamp).getTime() > h24);

  if (!recent.length) {
    el.innerHTML = '<div class="alert-box alert-info"><span class="alert-icon">ℹ️</span><div>No feeds logged in the last 24 hours.</div></div>';
    return;
  }

  const types = {};
  let totalDuration = 0;
  recent.forEach(f => {
    types[f.type] = (types[f.type] || 0) + 1;
    if (f.duration) totalDuration += parseInt(f.duration) || 0;
  });

  const avgInterval = recent.length > 1
    ? Math.round((new Date(recent[0].timestamp) - new Date(recent[recent.length-1].timestamp)) / 60000 / (recent.length - 1))
    : null;

  el.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;margin-bottom:14px">
      ${Object.entries(types).map(([t,c]) => `<span class="feed-type-pill">${t}: ${c}</span>`).join('')}
    </div>
    <div class="mini-stat-row">
      <div class="mini-stat">
        <div class="mini-stat-num" style="color:var(--accent)">${recent.length}</div>
        <div class="mini-stat-label">Total feeds</div>
      </div>
      ${avgInterval ? `<div class="mini-stat">
        <div class="mini-stat-num" style="color:var(--accent)">${fmtDuration(avgInterval)}</div>
        <div class="mini-stat-label">Avg interval</div>
      </div>` : ''}
      ${totalDuration > 0 ? `<div class="mini-stat">
        <div class="mini-stat-num" style="color:var(--accent)">${totalDuration}m</div>
        <div class="mini-stat-label">Total time</div>
      </div>` : ''}
    </div>`;
}

function renderDiaperSummary() {
  const el = document.getElementById('diaper-summary');
  const h24 = now() - 86400000;
  const recent = data.diapers.filter(d => new Date(d.timestamp).getTime() > h24);

  const wet = recent.filter(d => d.condition === 'Wet' || d.condition === 'Both').length;
  const dirty = recent.filter(d => d.condition === 'Dirty' || d.condition === 'Both').length;

  let alertHtml = '';
  if (!recent.length) {
    alertHtml = '<div class="alert-box alert-info" style="margin-top:12px"><span class="alert-icon">ℹ️</span><div>No diapers logged in the last 24 hours.</div></div>';
  } else if (wet < 6) {
    alertHtml = `<div class="alert-box alert-warn" style="margin-top:12px"><span class="alert-icon">⚠️</span><div>Fewer than 6 wet diapers in 24 hours. Monitor hydration closely. If this continues, consult your pediatrician.</div></div>`;
  } else {
    alertHtml = `<div class="alert-box alert-ok" style="margin-top:12px"><span class="alert-icon">✅</span><div>Hydration looks great — ${wet} wet diapers today!</div></div>`;
  }

  el.innerHTML = `
    <div class="mini-stat-row">
      <div class="mini-stat">
        <div class="mini-stat-num" style="color:var(--blue)">${wet}</div>
        <div class="mini-stat-label">Wet 💧</div>
      </div>
      <div class="mini-stat">
        <div class="mini-stat-num" style="color:var(--amber)">${dirty}</div>
        <div class="mini-stat-label">Dirty 💩</div>
      </div>
      <div class="mini-stat">
        <div class="mini-stat-num" style="color:var(--text2)">${recent.length}</div>
        <div class="mini-stat-label">Total</div>
      </div>
    </div>
    ${alertHtml}`;
}

/* ═══════════════════════════════════════ LOG MODAL ═══ */
let logActiveTab = 'feed';
let feedType = 'Breastmilk';
let diaperType = 'Wet';

function openLog(tab) {
  switchLogTab(tab);
  document.getElementById('log-modal').classList.add('open');
  // pre-fill date
  document.getElementById('weight-date').value = todayStr();
}

function closeLog() {
  document.getElementById('log-modal').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('log-modal')) closeLog();
}

function switchLogTab(tab) {
  logActiveTab = tab;
  ['feed','diaper','weight'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t === tab);
    document.getElementById('form-'+t).style.display = t === tab ? 'block' : 'none';
  });
}

function pickFeedType(btn) {
  feedType = btn.dataset.val;
  document.querySelectorAll('#feed-type-row .choice-btn').forEach(b => {
    const active = b === btn;
    b.style.borderColor = active ? 'var(--green)' : 'var(--border2)';
    b.style.background = active ? 'rgba(52,211,153,0.12)' : 'var(--input)';
    b.style.color = active ? 'var(--green)' : 'var(--text2)';
  });
}

function pickDiaperType(btn) {
  diaperType = btn.dataset.val;
  document.querySelectorAll('#diaper-type-row .choice-btn').forEach(b => {
    const active = b === btn;
    b.style.borderColor = active ? 'var(--blue)' : 'var(--border2)';
    b.style.background = active ? 'rgba(56,189,248,0.12)' : 'var(--input)';
    b.style.color = active ? 'var(--blue)' : 'var(--text2)';
  });
}

function submitFeed() {
  const duration = document.getElementById('feed-duration').value;
  const notes = document.getElementById('feed-notes').value.trim();
  data.feeds.unshift({
    id: now(),
    timestamp: new Date().toISOString(),
    type: feedType,
    duration: duration ? parseInt(duration) : null,
    notes: notes || null
  });
  save();
  document.getElementById('feed-duration').value = '';
  document.getElementById('feed-notes').value = '';
  closeLog();
  updateDashboard();
  if (currentView === 'history') renderHistory();
}

function submitDiaper() {
  const notes = document.getElementById('diaper-notes').value.trim();
  data.diapers.unshift({
    id: now(),
    timestamp: new Date().toISOString(),
    condition: diaperType,
    notes: notes || null
  });
  save();
  document.getElementById('diaper-notes').value = '';
  closeLog();
  updateDashboard();
  if (currentView === 'history') renderHistory();
}

function submitWeight() {
  const val = parseFloat(document.getElementById('weight-value').value);
  const date = document.getElementById('weight-date').value || todayStr();
  if (!val || val < 0.5 || val > 30) {
    document.getElementById('weight-value').style.borderColor = 'var(--red)';
    setTimeout(() => document.getElementById('weight-value').style.borderColor = '', 1500);
    return;
  }
  data.weights.push({ id: now(), date, weight: val, timestamp: new Date().toISOString() });
  data.weights.sort((a, b) => new Date(a.date) - new Date(b.date));
  save();
  document.getElementById('weight-value').value = '';
  closeLog();
  updateDashboard();
  if (currentView === 'history') renderHistory();
  if (currentView === 'analytics') renderAnalytics();
}

/* ═══════════════════════════════════════ DELETE ═══ */
function deleteFeed(idx) {
  if (!confirm('Delete this feed entry?')) return;
  data.feeds.splice(idx, 1);
  save();
  updateDashboard();
  renderHistory();
}

function deleteDiaper(idx) {
  if (!confirm('Delete this diaper entry?')) return;
  data.diapers.splice(idx, 1);
  save();
  updateDashboard();
  renderHistory();
}

function deleteWeight(idx) {
  if (!confirm('Delete this weight entry?')) return;
  data.weights.splice(idx, 1);
  save();
  updateDashboard();
  renderHistory();
}

/* ═══════════════════════════════════════ PROFILE ═══ */
function openProfile() {
  document.getElementById('profile-name').value = data.profile.name;
  document.getElementById('profile-birth').value = data.profile.birthDate || '';
  document.getElementById('profile-bw').value = data.profile.birthWeight || '';
  document.getElementById('profile-modal').classList.add('open');
}

function closeProfile() {
  document.getElementById('profile-modal').classList.remove('open');
}

function handleProfileOverlayClick(e) {
  if (e.target === document.getElementById('profile-modal')) closeProfile();
}

function saveProfile() {
  const name = document.getElementById('profile-name').value.trim();
  const birth = document.getElementById('profile-birth').value;
  const bw = parseFloat(document.getElementById('profile-bw').value) || null;
  data.profile = { name: name || 'Baby', birthDate: birth, birthWeight: bw };
  save();
  updateHeader();
  closeProfile();
}

/* ═══════════════════════════════════════ THEME ═══ */
function toggleTheme() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  const theme = isDark ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  data.theme = theme;
  document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
  save();
  if (currentView === 'analytics' && weightChart) {
    renderAnalytics();
  }
}

/* ═══════════════════════════════════════ INIT ═══ */
function applyChoiceStyling() {
  // Highlight default feed type
  document.querySelectorAll('#feed-type-row .choice-btn').forEach(b => {
    if (b.dataset.val === feedType) {
      b.style.borderColor = 'var(--green)';
      b.style.background = 'rgba(52,211,153,0.12)';
      b.style.color = 'var(--green)';
    }
  });
  document.querySelectorAll('#diaper-type-row .choice-btn').forEach(b => {
    if (b.dataset.val === diaperType) {
      b.style.borderColor = 'var(--blue)';
      b.style.background = 'rgba(56,189,248,0.12)';
      b.style.color = 'var(--blue)';
    }
  });
}

function init() {
  load();

  // Apply saved theme
  if (data.theme) {
    document.documentElement.dataset.theme = data.theme;
    document.getElementById('theme-btn').textContent = data.theme === 'dark' ? '☀️' : '🌙';
  }

  updateHeader();
  updateDashboard();
  applyChoiceStyling();

  // Live timer refresh every 60 seconds
  setInterval(() => {
    updateDashboard();
    if (currentView === 'history') renderHistory();
  }, 60000);

  // Open profile on first launch
  if (!data.profile.name) {
    setTimeout(openProfile, 400);
  }
}

init();
</script>
</body>
</html>
